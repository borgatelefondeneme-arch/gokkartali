<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07101e">
<title>Gök Kartalı 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07101e;--panel:rgba(12,22,40,.88);--panel2:rgba(22,36,62,.92);--line:rgba(120,180,255,.22);--acc:#3fb4ff;--acc2:#ffc531;--gem:#5ff2ff;--ok:#3ee27a;--bad:#ff4f5e;--txt:#e8f1ff;--mut:#8ea6c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Rajdhani',system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{user-select:text;-webkit-user-select:text}
.orb{font-family:'Orbitron',sans-serif}
.btn{min-height:56px;padding:0 22px;border-radius:14px;font-size:20px;font-weight:700;letter-spacing:.5px;background:linear-gradient(180deg,#2c4a76,#1a2d4e);border:1px solid var(--line);box-shadow:0 4px 0 #0a1424,inset 0 1px 0 rgba(255,255,255,.12);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1424}
.btn.sm{min-height:46px;font-size:17px;padding:0 14px;border-radius:12px}
.btn.pri{background:linear-gradient(180deg,#ffd451,#f29b14);color:#2a1700;border-color:#ffe08a;box-shadow:0 4px 0 #8a5000}
.btn.go{background:linear-gradient(180deg,#4ae98d,#1fae58);color:#03220e;border-color:#9effc4;box-shadow:0 4px 0 #0d6630}
.btn.danger{background:linear-gradient(180deg,#ff6a74,#c62f3c);border-color:#ff9aa2;box-shadow:0 4px 0 #6d1119}
.btn.gemb{background:linear-gradient(180deg,#5ff2ff,#1f9fc9);color:#00222c;box-shadow:0 4px 0 #0b5670}
.btn:disabled{opacity:.42;filter:grayscale(.7);pointer-events:none}
.btn.wide{width:100%}
.iconBtn{width:56px;height:56px;border-radius:14px;font-size:26px;background:var(--panel);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.iconBtn:active{transform:scale(.94)}

/* LOADING */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#13284a,#050b16);z-index:50;text-align:center;padding:20px}
#loading h1{font-family:Orbitron;font-size:clamp(32px,7vw,64px);margin:0;background:linear-gradient(180deg,#fff,#7cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px}
#loading p{color:var(--mut);font-size:20px;margin:0}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(63,180,255,.2);border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* HANGAR */
#hangar .top{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 14px;background:linear-gradient(180deg,rgba(4,9,18,.9),rgba(4,9,18,0))}
.logo{font-family:Orbitron;font-weight:900;font-size:22px;letter-spacing:2px;background:linear-gradient(180deg,#fff,#7cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;line-height:1}
.logo small{display:block;font-size:10px;letter-spacing:4px;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px;min-height:50px;font-weight:700;font-size:20px}
.lvlNum{font-family:Orbitron;font-size:22px;color:var(--acc2)}
.xpWrap{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);font-weight:600}
.xpbar{width:130px;height:9px;background:#0a1424;border-radius:6px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fb4ff,#8a5cff)}
.gold{color:var(--acc2)} .gem{color:var(--gem)}
.hPanel{position:absolute;right:12px;top:86px;bottom:92px;width:min(470px,47vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:58px;font-size:17px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tab span{font-size:22px}
.tabKapat{flex:none;width:46px;min-height:58px;font-size:22px;color:var(--acc);border-bottom:3px solid transparent;border-right:1px solid var(--line)}
.hPanel.kapali .tabBody{display:none}
.hPanel.kapali{bottom:auto!important;height:auto!important}
.hPanel.kapali .tabKapat{color:var(--acc2)}
.shopRow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--panel2);margin-bottom:10px}
.shopRow .si{font-size:28px;width:44px;text-align:center}
.shopRow .st{flex:1;min-width:0}.shopRow .st b{display:block;font-size:17px}.shopRow .st small{color:var(--mut);font-size:14px;line-height:1.2;display:block}
.shopRow.aktif{border:2px solid var(--ok);background:rgba(62,226,122,.08)}
.tab{font-size:15px;min-width:0}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.swc{aspect-ratio:1;min-height:40px;border-radius:12px;border:3px solid rgba(255,255,255,.12);position:relative;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),inset 0 4px 8px rgba(255,255,255,.18)}
.swc.on{border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.45),inset 0 -6px 10px rgba(0,0,0,.25)}
.swc .lk{position:absolute;right:2px;bottom:1px;font-size:12px;filter:drop-shadow(0 1px 2px #000)}
.buyBar{position:sticky;bottom:-12px;margin:10px -12px -12px;padding:12px;background:rgba(10,20,40,.97);border-top:1px solid var(--acc);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:16px}
.stageSel .iconBtn{width:46px}.stageSel .lvj{width:40px;font-size:22px;color:var(--acc2)}
.stageSel div{min-width:150px}
.tab.on{color:var(--txt);border-bottom-color:var(--acc);background:rgba(63,180,255,.08)}
.tabBody{flex:1;overflow-y:auto;padding:12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabBody::-webkit-scrollbar{width:6px}.tabBody::-webkit-scrollbar-thumb{background:#2a4670;border-radius:3px}
.card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--panel2);border:2px solid transparent;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.card.pv{border-color:var(--acc);box-shadow:0 0 18px rgba(63,180,255,.25)}
.card.locked{opacity:.65}
.cIco{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;background:rgba(255,255,255,.06);flex:none}
.cTxt{flex:1;min-width:0}
.cTxt b{font-size:19px;display:block}
.cTxt small{display:block;color:var(--mut);font-size:15px;line-height:1.2;margin-top:2px}
.cTxt .mini{font-size:14px;color:#b9cbe6;margin-top:4px}
.tag{display:inline-block;padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px;white-space:nowrap}
.tag.on{background:rgba(62,226,122,.15);color:var(--ok);border:1px solid rgba(62,226,122,.4)}
.tag.lock{background:rgba(255,255,255,.06);color:var(--mut)}
.secT{font-family:Orbitron;font-size:14px;letter-spacing:2px;color:var(--acc);margin:6px 2px 10px}
.upRow{padding:12px;border-radius:14px;background:var(--panel2);margin-bottom:10px}
.upHead{display:flex;align-items:center;gap:10px}
.upHead b{font-size:19px;flex:1}
.pips{display:flex;gap:4px;margin:10px 0}
.pips i{flex:1;height:10px;border-radius:3px;background:#0b1628;border:1px solid #1d3354}
.pips i.on{background:linear-gradient(180deg,#5fd0ff,#2b8be0);border-color:#7fd8ff;box-shadow:0 0 6px rgba(63,180,255,.6)}
.upFoot{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:15px;color:var(--mut)}
.optGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.opt{min-height:118px;border-radius:14px;background:var(--panel2);border:2px solid transparent;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.opt .oi{font-size:32px}
.opt b{font-size:16px;line-height:1.1}
.opt small{font-size:12.5px;color:var(--mut);line-height:1.15}
.opt.on{border-color:var(--acc2);background:rgba(255,197,49,.1);box-shadow:0 0 16px rgba(255,197,49,.2)}
.toggleRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel2);margin-bottom:10px;font-size:18px;font-weight:600}
.sw{width:74px;height:42px;border-radius:21px;background:#22324d;position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:#cfe0f7;transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:36px}
.info{position:absolute;left:14px;bottom:92px;width:min(400px,44vw);background:linear-gradient(90deg,rgba(8,16,30,.82),rgba(8,16,30,.45));border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.info h2{font-family:Orbitron;margin:0;font-size:24px;letter-spacing:1px}
.info .sub{color:var(--mut);font-size:16px;margin:2px 0 10px}
.stat{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:5px 0}
.stat span{width:76px;color:#b9cbe6}
.stat .sb{flex:1;height:9px;border-radius:5px;background:#0a1424;overflow:hidden}
.stat .sb i{display:block;height:100%;background:linear-gradient(90deg,#3fb4ff,#5ff2ff)}
.stat em{font-style:normal;width:44px;text-align:right;color:var(--txt)}
.loadIcons{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.loadIcons span{background:rgba(255,255,255,.07);border-radius:10px;padding:5px 10px;font-size:14px;font-weight:600}
#hangar .bottom{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(4,9,18,.92),rgba(4,9,18,0))}
.stageSel{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px;margin-left:auto}
.stageSel .iconBtn{width:52px;height:52px;background:var(--panel2)}
.stageSel div{min-width:130px;text-align:center;line-height:1.05}
.stageSel b{font-family:Orbitron;font-size:18px;display:block}
.stageSel small{color:var(--mut);font-size:14px}
#takeoffBtn{min-width:200px;font-size:22px;min-height:64px}
.mpChip{background:rgba(62,226,122,.14);border:1px solid rgba(62,226,122,.45);color:var(--ok);border-radius:14px;padding:0 14px;min-height:56px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px}
@media (orientation:portrait){
  .hPanel{left:10px;right:10px;width:auto;top:auto;bottom:88px;height:47vh}
  .info{left:10px;right:10px;width:auto;top:80px;bottom:auto;padding:10px 12px}
  .info h2{font-size:20px}.info .stats{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
  .stat span{width:64px}.stat em{width:36px}
  .xpbar{width:90px}
  .logo{font-size:17px}
  #hangar .bottom{flex-wrap:wrap}
  .stageSel{margin-left:0}
  #takeoffBtn{flex:1;min-width:0}
}
@media (max-width:760px) and (orientation:landscape){.info{display:none}.hPanel{width:62vw}}
@media (max-width:620px){.tab{font-size:12px}.tab span{font-size:20px}.stageSel .lvj{display:none}}
@media (max-width:520px){.chip{font-size:16px;padding:4px 8px;min-height:44px}.logo{display:none}.btnLbl{display:none}}

/* MODAL */
#modalWrap{position:fixed;inset:0;background:rgba(2,6,14,.68);display:flex;align-items:center;justify-content:center;z-index:30;padding:14px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal{width:min(600px,100%);max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#14243f,#0c1628);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.6);touch-action:pan-y}
#modal h2{font-family:Orbitron;margin:0 0 12px;font-size:26px;text-align:center;letter-spacing:1px}
#modal p{color:#b9cbe6;font-size:18px;line-height:1.35}
.mBtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.mBtns .btn{flex:1}
.codeBig{font-family:Orbitron;font-size:64px;letter-spacing:14px;text-align:center;color:var(--acc2);margin:10px 0;text-shadow:0 0 24px rgba(255,197,49,.4)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.keypad .btn{min-height:66px;font-size:28px;font-family:Orbitron}
.pCards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pCard{background:var(--panel2);border-radius:14px;padding:12px;border:2px solid rgba(63,180,255,.4)}
.pCard.p2{border-color:rgba(62,226,122,.5)}
.pCard b{display:block;font-size:19px}.pCard small{display:block;color:var(--mut);font-size:15px;line-height:1.3}
.resRow{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.07);font-size:19px;font-weight:600}
.mis{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);margin-top:6px;font-size:17px}
.mis.ok{background:rgba(62,226,122,.12)}
.lvUp{text-align:center;font-family:Orbitron;color:var(--acc2);font-size:22px;margin:12px 0;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.06);text-shadow:0 0 18px rgba(255,197,49,.6)}}
.inp{width:100%;min-height:54px;border-radius:12px;border:1px solid var(--line);background:#0a1424;color:var(--txt);font-size:20px;padding:0 14px;font-family:inherit}
.ver{text-align:center;color:#4d6385;font-size:14px;margin-top:14px;cursor:default}
.cheat{margin-top:12px;padding:12px;border-radius:14px;border:1px dashed #ff9b3d;background:rgba(255,155,61,.08)}

/* HUD */
#hud .hudTop{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:flex-start;padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none}
#hud .hudTop>*{pointer-events:auto}
.hbox{background:rgba(6,12,24,.7);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.hpBox{width:min(240px,34vw)}
.hl{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:1px;display:flex;justify-content:space-between}
.bar{height:12px;border-radius:6px;background:#0a1424;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3ee27a,#a6ff5c);transition:width .15s}
.bar.thin{height:7px}
.bar.prog i{background:linear-gradient(90deg,#3fb4ff,#8a5cff)}
.stBox{flex:1;text-align:center;max-width:300px;margin:0 auto}
.stBox b{font-family:Orbitron;font-size:15px;letter-spacing:1px}
.lootBox{display:flex;gap:12px;font-size:19px;font-weight:700;align-items:center}
#bossBar{position:absolute;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(560px,86vw);text-align:center;font-family:Orbitron;font-size:13px;letter-spacing:2px;color:#ff8f8f}
#bossBar .bar{height:14px;border:1px solid rgba(255,90,90,.5)}
#bossBar .bar i{background:linear-gradient(90deg,#ff3b4f,#ff9a3c)}
#mateBox{position:absolute;left:10px;top:calc(66px + env(safe-area-inset-top));font-size:15px;font-weight:700;width:min(240px,34vw)}
#mateBox .bar i{background:linear-gradient(90deg,#3fb4ff,#5ff2ff)}
#centerMsg{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;font-family:Orbitron;font-size:clamp(24px,5vw,44px);font-weight:900;text-shadow:0 0 20px rgba(0,0,0,.8),0 0 30px rgba(63,180,255,.5);pointer-events:none;opacity:0;transition:opacity .3s;width:92vw}
#centerMsg small{display:block;font-family:Rajdhani;font-size:clamp(17px,2.6vw,24px);font-weight:700;color:#cfe0f7;margin-top:6px;letter-spacing:.5px}
#centerMsg.show{opacity:1}
#respawnMsg{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font-family:Orbitron;font-size:28px;text-align:center;pointer-events:none;text-shadow:0 0 12px #000}
#pcHint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:14px;color:rgba(232,241,255,.55);white-space:nowrap;pointer-events:none;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){#hud .hudTop{gap:6px;padding-left:6px;padding-right:6px}.hpBox{width:24vw}.stBox{max-width:30vw}.lootBox{flex-direction:column;gap:0!important;font-size:12px!important;line-height:1.2}.stBox b{font-size:11px}.lootBox{font-size:14px;gap:6px}#hud .iconBtn{width:44px;height:44px;font-size:20px}.hbox{padding:4px 7px}.rb{width:88px;height:88px}#btnBomb{width:100px;height:100px}.rb .ri{font-size:30px}#mateBox{width:44vw}}
.ctl{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end}
.rb{--p:100;width:104px;height:104px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:15px;line-height:1;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle,rgba(10,20,40,.75) 55%,transparent 56%),conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.08) 0);box-shadow:0 6px 18px rgba(0,0,0,.4);touch-action:none}
.rb .ri{font-size:36px;margin-bottom:4px}
.rb.ready{border-color:#fff;box-shadow:0 0 22px var(--c)}
.rb kbd{font-family:inherit;font-size:12px;color:var(--mut);margin-top:3px}
#btnBomb{--c:#ff7a3c;width:118px;height:118px}
#btnAux{--c:#3fb4ff}
#btnFire{--c:#ffd451}
.pc .rb{width:84px;height:84px;font-size:13px}.pc #btnBomb{width:92px;height:92px}.pc .rb .ri{font-size:28px}
#floatLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.ft{position:absolute;font-family:Orbitron;font-weight:900;font-size:16px;transform:translate(-50%,-50%);text-shadow:0 2px 4px #000,0 0 10px rgba(0,0,0,.6);animation:ftUp 1s forwards;white-space:nowrap}
.ft.gold{color:var(--acc2)}.ft.gem{color:var(--gem)}.ft.crit{color:#ff5b5b;font-size:20px}.ft.dodge{color:#7dffb0;font-size:18px}.ft.pw{color:#9dff6a;font-size:20px}
@keyframes ftUp{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(10,20,40,.94);border:1px solid var(--acc);border-radius:14px;padding:12px 20px;font-size:18px;font-weight:700;z-index:60;pointer-events:none;opacity:0;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px;background:#050b16;z-index:99}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="loading"><h1>GÖK KARTALI 3D</h1><div class="spin"></div><p id="loadTxt">Hangar hazırlanıyor…</p></div>

<!-- HANGAR -->
<div id="hangar" class="layer hidden">

const Net = { peer: null, conn: null, role: null, code: '', remote: null, status: 'off', joinTimer: 0, joinCode: '' };

async function iceAl() {

  const c = window.GK_TURN || {};

  if (c.turnKullanici && c.turnSifre) {
    const s = c.turnSunucu || 'standard.relay.metered.ca', u = c.turnKullanici.trim(), p = c.turnSifre.trim();
    ['turn:' + s + ':80', 'turn:' + s + ':80?transport=tcp', 'turn:' + s + ':443', 'turns:' + s + ':443?transport=tcp'].forEach(url => ice.push({ urls: url, username: u, credential: p }));
  }
  if (c.meteredUygulama && c.meteredApiKey) {
    try {
      const r = await fetch('https://' + c.meteredUygulama + '.metered.live/api/v1/turn/credentials?apiKey=' + encodeURIComponent(c.meteredApiKey));
      if (r.ok) { const j = await r.json(); if (Array.isArray(j)) ice.push(...j); }
    } catch (e) { console.warn('TURN bilgisi alınamadı', e); }
  }
  Net.turnVar = ice.some(s => /^turns?:/.test(Array.isArray(s.urls) ? s.urls[0] : String(s.urls)));
  return ice;
}
function turnAyarli() { const c = window.GK_TURN || {}; return !!((c.turnKullanici && c.turnSifre) || (c.meteredUygulama && c.meteredApiKey) || (Array.isArray(c.sunucular) && c.sunucular.length)); }
function peerOk() { if (typeof Peer === 'undefined') { toast('Çok oyunculu kütüphane (PeerJS) yüklenemedi. İnternet bağlantısını kontrol edin.'); return false; } return true; }
function netHost() {
  if (!peerOk()) return; netReset();
  Net.role = 'host'; Net.code = String(rint(1000, 9999)); Net.status = 'hosting';
  iceAl().then(ice => { if (Net.role !== 'host' || Net.peer) return; netHostPeer(ice); });
  renderMp();
}
function netHostPeer(ice) {
  const peer = new Peer(PEER_PREFIX + Net.code, { debug: 1, config: { iceServers: ice } }); Net.peer = peer;
  peer.on('open', () => renderMp());
  peer.on('connection', c => {
    if (Net.conn && Net.conn.open) { c.on('open', () => { c.send({ t: 'full' }); setTimeout(() => c.close(), 400); }); return; }
    bindConn(c);

  peer.on('error', err => { if (err.type === 'unavailable-id') { netHost(); return; } toast('Bağlantı hatası: ' + err.type); if (!Net.conn) { netReset(); renderMp(); } });

  renderMp();
}
function netJoin(code) {
  if (!peerOk()) return; netReset();
  Net.role = 'guest'; Net.code = code; Net.status = 'connecting'; renderMp();
  iceAl().then(ice => { if (Net.status !== 'connecting' || Net.peer) return; netJoinPeer(ice, code); });
  Net.joinTimer = setTimeout(() => { if (Net.status === 'connecting') { toast(turnAyarli() ? 'Bağlantı zaman aşımına uğradı' : 'Bağlanılamadı. Farklı ağlarda oynamak için turn-config.js ayarı gerekir (README).', 5); netReset(); renderMp(); } }, 20000);
}
function netJoinPeer(ice, code) {
  const peer = new Peer({ debug: 1, config: { iceServers: ice } }); Net.peer = peer;

}

      const before = S.level; S.level = Math.min(100, S.level + 10); S.xp = 0; S.gold += 5000; S.gems += 5000;
      S.maxStage = Math.min(MAX_STAGE, S.maxStage + 40); save();
      cheatShown = false; verTaps = 0; closeModal(); sfx.levelup();
      toast(`Pilot Lv ${before} → ${S.level} · ${stageLabel(S.maxStage).split(' · ')[0]} açıldı · +5000 💰 · +5000 💎`, 3.5); renderHangar();
    }
    if (act === 'reset') {
      openModal(`<h2>⚠ KAYDI SIFIRLA</h2><p style="text-align:center">Tüm level, altın, elmas, uçak, modifiye ve pilotlar silinecek. Bu işlem geri alınamaz.</p><div class="mBtns"><button class="btn" data-m="no">Vazgeç</button><button class="btn danger" data-m="yes">Evet, Sıfırla</button></div>`, a => {
        if (a === 'yes') { S = defSave(); save(); pvPlane = S.plane; pvPilot = S.pilot; closeModal(); renderHangar(); toast('Kayıt sıfırlandı'); }
        else openSettings();
      });
    }
    if (act === 'close') { const v = ($('#nameInp').value || '').trim().slice(0, 14); S.name = v || 'Pilot'; profileChanged(); cheatShown = false; verTaps = 0; closeModal(); renderHangar(); }
  });
  $('#nameInp').addEventListener('change', () => { const v = ($('#nameInp').value || '').trim().slice(0, 14); S.name = v || 'Pilot'; profileChanged(); });
}
function refreshSettingsSw() {
  const rows = document.querySelectorAll('#modal .toggleRow');
  const vals = { af: S.autoFire, snd: S.sound, bloom: S.bloom };
  rows.forEach(r => { const k = r.dataset.m; r.querySelector('.sw').classList.toggle('on', !!vals[k]); });
  renderInfo();
}

// ===================== ÇOK OYUNCULU ARAYÜZÜ =====================
function openMp() { mpOpen = true; renderMp(); }
function profDesc(p) {
  if (!p) return '<small>Bekleniyor…</small>';
  const pl = planeDef(p.plane), pd = pilotDef(p.pilot), w = WEAPONS.find(x => x.id === p.weapon) || WEAPONS[0], b = BOMBS.find(x => x.id === p.bomb) || BOMBS[0];
  return `<b>${escapeHtml(p.name || 'Pilot')} <span style="color:var(--acc2);font-size:15px">Lv ${p.level || 1}</span></b><small>${pl.icon} ${pl.name}</small><small>${pd.icon} ${pd.name}</small><small>${w.icon} ${w.name} · ${b.icon} ${b.name}</small>`;
}
function renderMp() {
  if (!mpOpen) return;
  let h = '';
  if (Net.status === 'off') {
    h = `<h2>👥 ÇOK OYUNCULU</h2><p style="text-align:center">PC ve tablet doğrudan eşleşir (sunucusuz WebRTC).<br>Bir cihaz <b>oda kurar</b>, diğeri <b>4 haneli kodu</b> girer.<br>Her oyuncu kendi hangarındaki uçak, pilot ve silahlarla uçar.</p>
      <div class="mBtns"><button class="btn go" data-m="host">🛰 ODA KUR</button><button class="btn pri" data-m="join">🔑 ODAYA KATIL</button></div>
      <div class="mBtns"><button class="btn" data-m="close">Kapat</button></div>`;
  } else if (Net.status === 'hosting') {
    h = `<h2>🛰 ODA KURULDU</h2><p style="text-align:center">Diğer cihazda <b>Çok Oyunculu → Odaya Katıl</b> deyip bu kodu girin:</p>
      <div class="codeBig">${Net.peer && Net.peer.open ? Net.code : '····'}</div>
      <p style="text-align:center"><span class="spin" style="display:inline-block;width:26px;height:26px;border-width:4px;vertical-align:middle"></span> Kanat pilotu bekleniyor…</p>
      <div class="mBtns"><button class="btn danger" data-m="leave">Odayı Kapat</button><button class="btn" data-m="close">Hangarda Bekle</button></div>`;
  } else if (Net.status === 'connecting') {
    h = `<h2>🔑 BAĞLANILIYOR</h2><div class="codeBig">${Net.code}</div><p style="text-align:center"><span class="spin" style="display:inline-block;width:26px;height:26px;border-width:4px;vertical-align:middle"></span> Odaya bağlanılıyor…</p>
      <div class="mBtns"><button class="btn danger" data-m="leave">İptal</button></div>`;
  } else if (Net.status === 'joinpad') {
    const c = Net.joinCode.padEnd(4, '·');
    h = `<h2>🔑 ODA KODU</h2><div class="codeBig">${c}</div>
      <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="btn" data-m="k${n}">${n}</button>`).join('')}<button class="btn danger" data-m="kdel">⌫</button><button class="btn" data-m="k0">0</button><button class="btn go" data-m="kgo" ${Net.joinCode.length === 4 ? '' : 'disabled'}>✔</button></div>
      <div class="mBtns"><button class="btn" data-m="back">◀ Geri</button></div>`;
  } else if (Net.status === 'lobby') {
    const me = profile(), host = Net.role === 'host';
    const p1 = host ? me : Net.remote, p2 = host ? Net.remote : me;
    h = `<h2>🔗 ODA ${Net.code}</h2><div class="pCards"><div class="pCard"><small style="color:var(--acc)">P1 · KAPTAN</small>${profDesc(p1)}</div><div class="pCard p2"><small style="color:var(--ok)">P2 · KANAT PİLOTU</small>${profDesc(p2)}</div></div>
      <p style="text-align:center;font-size:16px">Uçak/pilot/mühimmat değiştirmek için hangarı düzenleyin — eşinize otomatik iletilir.<br>Vurulan oyuncu <b>5 saniye</b> içinde yeniden doğar.</p>
      <div class="mBtns">${host ? `<button class="btn go" data-m="start">🛫 BİRLİKTE KALKIŞ · ${stageLabel(S.stage)}</button>` : `<button class="btn" disabled>⏳ Kaptanın kalkışı bekleniyor…</button>`}</div>
      <div class="mBtns"><button class="btn" data-m="close">🔧 Hangarı Düzenle</button><button class="btn danger" data-m="leave">Bağlantıyı Kes</button></div>`;
  }
  openModal(h, act => {
    if (act === 'host') netHost();
    else if (act === 'join') { Net.status = 'joinpad'; Net.joinCode = ''; renderMp(); }
    else if (act === 'back') { Net.status = 'off'; renderMp(); }
    else if (act === 'leave') { netReset(); renderMp(); renderHangar(); }
    else if (act === 'close') { closeModal(); }
    else if (act === 'start') { takeOff(); }
    else if (act === 'kdel') { Net.joinCode = Net.joinCode.slice(0, -1); renderMp(); }
    else if (act === 'kgo') { if (Net.joinCode.length === 4) netJoin(Net.joinCode); }
    else if (act[0] === 'k' && act.length === 2) { if (Net.joinCode.length < 4) Net.joinCode += act[1]; renderMp(); }
  });
  mpOpen = true;
}

// ===================== GİRDİ =====================
const KEYMAP = { KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyJ: 'fire', KeyZ: 'fire', KeyK: 'fire' };
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (appState === 'hangar') { if (e.code === 'Enter' && $('#modalWrap').classList.contains('hidden')) takeOff(); return; }
  if (appState !== 'play') return;
  dokunmaModu = false;
  const k = KEYMAP[e.code]; if (k) { keys[k] = 1; e.preventDefault(); }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) requestBomb(); }
  if ((e.code === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) requestAux();
  if (e.code === 'KeyF' && !e.repeat) { S.autoFire = !S.autoFire; save(); toast(S.autoFire ? '🔫 Otomatik ateş AÇIK' : '✋ Otomatik ateş KAPALI (J/Z/Fare ile ateş)', 1.6); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && !e.repeat) togglePause();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = 0; });
addEventListener('blur', () => { Object.keys(keys).forEach(k => keys[k] = 0); mouseFire = touchFire = false; drag = null; });
canvas.addEventListener('pointerdown', e => {
  sfx.init();
  if (appState !== 'play' || !G) return;
  dokunmaModu = e.pointerType === "touch";
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  try { canvas.setPointerCapture(e.pointerId); } catch (er) { }
  if (e.pointerType === 'mouse' && e.button === 0) mouseFire = true;
});
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || !G) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  const p = G.players[G.me]; if (!p || !p.alive) return;
  const sens = e.pointerType === 'mouse' ? 1.0 : 1.3;
  p.tx += dx * WPP * sens; p.ty -= dy * WPP * sens;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; if (e.pointerType === 'mouse') mouseFire = false; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());
function holdBtn(el, down, up) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); sfx.init(); down(); });
  if (up) { el.addEventListener('pointerup', e => { e.stopPropagation(); up(); }); el.addEventListener('pointerleave', () => up()); el.addEventListener('pointercancel', () => up()); }
}
holdBtn($('#btnBomb'), () => requestBomb());
holdBtn($('#btnAux'), () => requestAux());
holdBtn($('#btnFire'), () => { touchFire = true; }, () => { touchFire = false; });
$('#pauseBtn').addEventListener('click', () => togglePause());
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('button, .card, .toggleRow')) sfx.click(); }, true);
document.addEventListener('pointerdown', () => sfx.init(), { passive: true });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ===================== BOYUTLANDIRMA =====================
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setSize(innerWidth, innerHeight); if (bloomPass) bloomPass.resolution.set(innerWidth, innerHeight); }
  if (appState === 'play' || appState === 'result') layoutGameCamera(); else layoutHangarCamera();
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 300));

// ===================== ANA DÖNGÜ =====================
function setupComposer() {
  try {
    if (!THREE.EffectComposer || !THREE.RenderPass || !THREE.UnrealBloomPass) return;
    let rt;
    if (renderer.capabilities.isWebGL2 && Q.msaa && THREE.WebGLMultisampleRenderTarget) {
      rt = new THREE.WebGLMultisampleRenderTarget(innerWidth * PR, innerHeight * PR, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
      rt.samples = Q.msaa;
    }
    composer = rt ? new THREE.EffectComposer(renderer, rt) : new THREE.EffectComposer(renderer);
    composer.setPixelRatio(PR); composer.setSize(innerWidth, innerHeight);
    renderPass = new THREE.RenderPass(hangarScene, camera); composer.addPass(renderPass);
    bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.45, 0.62); composer.addPass(bloomPass);
    if (!rt) console.warn('MSAA yok (WebGL1) — bloom kenar yumuşatmasız çalışır');
  } catch (e) { console.warn('Bloom devre dışı', e); composer = null; }
}
function renderFrame(scene) {
  if (composer && S.bloom) { renderPass.scene = scene; if (scene === gameScene) { bloomPass.threshold = 0.95; bloomPass.strength = 0.4; bloomPass.radius = 0.25; } else { bloomPass.threshold = 0.9; bloomPass.strength = 0.35; bloomPass.radius = 0.3; } try { composer.render(); return; } catch (e) { composer = null; } }
  renderer.render(scene, camera);
}
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0.0001, (now - lastT) / 1000)); lastT = now;
  if ((appState === 'play' || appState === 'result') && G) {
    if (appState === 'play' && !G.paused) {
      if (G.mode === 'guest') { localControl(dt); updateGuest(dt); }
      else { localControl(dt); updateSim(dt); }
      if (G) netTick(dt);
    }
    if (G) { renderGame(appState === 'play' && G.paused ? 0 : dt); if (appState === 'play') updateHUD(dt); }
    renderFrame(gameScene);
  } else {
    hangarUpdate(dt);
    renderFrame(hangarScene);
  }
}

// ===================== BAŞLAT =====================
function init() {
  setupComposer();
  // Kayıt doğrulama
  if (!S.planes[S.plane]) S.plane = 'p40';
  if (!S.pilots.includes(S.pilot)) S.pilot = 'kaya';
  S.stage = clamp(S.stage, 1, S.maxStage);
  pvPlane = S.plane; pvPilot = S.pilot;
  // modelleri önceden ısıt (ilk karede takılmayı önler)
  appState = 'hangar';
  layoutHangarCamera(); renderHangar();
  panelAc(!S.panelKapali);
  $('#hangar').classList.remove('hidden');
  let yuklendi = false;
  const bitir = () => { if (yuklendi) return; yuklendi = true; $('#loading').classList.add('hidden'); };
  $('#loadTxt').textContent = '3D modeller yükleniyor…';
  glbYukle(() => {
    Object.keys(unitPools).forEach(k => delete unitPools[k]); Object.keys(bossCache).forEach(k => delete bossCache[k]);
    Object.keys(hPilotCache).forEach(k => delete hPilotCache[k]); hPlaneKey = '';
    const fz = glbTekGeometri('fuze'); if (fz) { IM.missile.geometry = fz.geo; IM.missile.material = fz.mat; }
    const bb = glbTekGeometri('bomba'); if (bb) IM.bomb = makeInst(bb.geo, bb.mat, 120);
    if (appState === 'hangar') renderHangar();
    bitir();
  });
  setTimeout(bitir, 8000);
  requestAnimationFrame(loop);
  if (typeof Peer === 'undefined') console.warn('PeerJS yüklenemedi — çok oyunculu kullanılamaz.');
}
init();
</script>
